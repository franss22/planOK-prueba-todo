[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.0,<6.0",
    "django-cors-headers>=4.3.0",
    "djangorestframework>=3.15,<4.0",
    "langchain>=0.2.0",
    "langchain-xai>=1.3.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

[project.scripts]
manage = "config.cli:manage"
migrate = "config.cli:migrate"
makemigrations = "config.cli:makemigrations"
runserver = "config.cli:runserver"
seed = "config.cli:seed_tasks"
test = "config.cli:test"




[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["config", "tasks"]



[tool.ruff]
# Same as flake8 default line length
line-length = 120
target-version = "py314"


[tool.ruff.lint]
# Enable rules equivalent to your flake8 plugins
select = [
    "E",   # pycodestyle errors (equivalent to flake8 base)
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (equivalent to flake8 base)
    "B",   # flake8-bugbear
    "D",   # pydocstyle (equivalent to flake8-docstrings)
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "TC",  # type-checking rules
    "I",   # isort

]

# Ignore specific rules that might be too strict
ignore = [
    "D107",   # Missing docstring in __init__
    "ANN401", # Using Any without type annotation for public method
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line (conflicts with D212)
    "B008",   # Function calls in default arguments
    "UP046",  # 3.13 Generic types in classes
    "UP047",  # 3.13 Generic types in functions
    "D401",   # First line of comments in imperative mood
]


[tool.ruff.lint.pydocstyle]
# Use PEP 257 convention for docstrings
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Allow missing docstrings in test files
"test/*.py" = ["D"]
"**/test_*.py" = ["D"]
"**/migrations/*.py" = ["D", "RUF012"]

[tool.ruff.lint.mccabe]
# Equivalent to flake8's complexity checking
max-complexity = 10

# Format configuration (equivalent to Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

