services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planok}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planok}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: >
      sh -c "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    expose:
      - "8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB:-planok}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-4}
    labels:
      - "traefik.enable=true"

      # API router
      - "traefik.http.routers.planok-api.rule=Host(`planok-test.emidev.cl`) && PathPrefix(`/api/v1`)"
      - "traefik.http.routers.planok-api.entrypoints=https"
      - "traefik.http.routers.planok-api.tls=true"
      - "traefik.http.routers.planok-api.priority=100"
      # backend service
      - "traefik.http.services.planok-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000" ]
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"

      # Frontend router
      - "traefik.http.routers.planok-frontend.rule=Host(`planok-test.emidev.cl`)"
      - "traefik.http.routers.planok-frontend.entrypoints=https"
      - "traefik.http.routers.planok-frontend.tls=true"
      - "traefik.http.routers.planok-frontend.priority=1"

      - "traefik.http.services.planok-frontend.loadbalancer.server.port=3000"
    depends_on:
      - api

volumes:
  postgres_data:
